[platformio]
default_envs = c16

[env:c16]
platform = native
# Note: PlatformIO doesn't natively support 6502, so we use custom build
build_flags =
    -D TARGET_C16
    -D LOAD_ADDRESS=0x1960

# Custom build script
extra_scripts =
    pre:scripts/build_6502.py

# Monitor settings for VICE emulator integration
monitor_speed = 115200

# Build artifacts
build_dir = build
build_type = release

# Source locations
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test

# Custom upload command (launches VICE)
upload_protocol = custom
upload_command = scripts/run_vice.sh $SOURCE

[env:c16_debug]
extends = env:c16
build_type = debug
build_flags =
    ${env:c16.build_flags}
    -D DEBUG=1
    -D ENABLE_DESIGNER=1

[env:designer]
# Build the level designer separately
extends = env:c16
build_flags =
    ${env:c16.build_flags}
    -D BUILD_DESIGNER=1
src_filter =
    +<designer/>

# Development settings
[dev]
assembler = ca65
linker = ld65
emulator = xplus4
assembler_flags = -t c16 -g
linker_flags = -t c16 -Ln build/labels.txt -m build/map.txt

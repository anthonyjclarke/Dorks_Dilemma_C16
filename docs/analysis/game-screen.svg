<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img">
<title>Where the graphics appear: the restored C16 gameplay display</title>
<desc>Existing VICE capture at gameplay entry, enlarged 2x without smoothing. Labels describe the screen layout.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="24" y="32" font-family="monospace" font-size="21" fill="#0f172a">Where the graphics appear: the restored C16 gameplay display</text>
<text x="24" y="57" font-family="monospace" font-size="12" fill="#475569">Existing VICE capture at gameplay entry, enlarged 2x without smoothing. Labels describe the screen layout.</text>
<image x="16" y="76" width="768" height="576" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<rect x="80" y="156" width="512" height="384" fill="none" stroke="#38bdf8"/>
<rect x="592" y="156" width="128" height="384" fill="none" stroke="#fef08a"/>
<rect x="80" y="540" width="640" height="16" fill="none" stroke="#ef4444"/>
<text x="800" y="111" font-family="monospace" font-size="12" fill="#0284c7">Room: columns 0-31</text>
<text x="800" y="142" font-family="monospace" font-size="12" fill="#0f172a">Rows 0-23: 256 x 192 dots</text>
<text x="800" y="173" font-family="monospace" font-size="12" fill="#0f172a">MUFF -&gt; DECODE -&gt; SCRBUF</text>
<text x="800" y="204" font-family="monospace" font-size="12" fill="#0f172a">FADEIN -&gt; screen + attributes</text>
<text x="800" y="235" font-family="monospace" font-size="12" fill="#0f172a">Actors overwrite room cells</text>
<text x="800" y="266" font-family="monospace" font-size="12" fill="#0f172a">Player: PRINT / NORMPR</text>
<text x="800" y="297" font-family="monospace" font-size="12" fill="#0f172a">Aliens: PRNALS</text>
<text x="800" y="328" font-family="monospace" font-size="12" fill="#0f172a">Jigsaw: PRPICE</text>
<text x="800" y="359" font-family="monospace" font-size="12" fill="#854d0e">Sidebar: columns 32-39</text>
<text x="800" y="390" font-family="monospace" font-size="12" fill="#0f172a">PRBDER / SETWIN: frame, text</text>
<text x="800" y="421" font-family="monospace" font-size="12" fill="#0f172a">READY: bomb charge icon</text>
<text x="800" y="452" font-family="monospace" font-size="12" fill="#0f172a">TRANSF: collected pieces</text>
<text x="800" y="483" font-family="monospace" font-size="12" fill="#0f172a">RADAR: 5 x 5 room map</text>
<text x="800" y="514" font-family="monospace" font-size="12" fill="#dc2626">Bottom: row 24 / 40 cells</text>
<text x="800" y="545" font-family="monospace" font-size="12" fill="#0f172a">MESSVE + raster fine scroll</text>
<text x="800" y="576" font-family="monospace" font-size="12" fill="#0f172a">Display: 40 x 25 characters</text>
<text x="800" y="607" font-family="monospace" font-size="12" fill="#0f172a">$0C00 codes / $0800 attributes</text>
</svg>
